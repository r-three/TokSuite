[project]
name = "toksuite"
version = "0.1.0"
description = "Code base for toksuite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uv",
    "setuptools",
    "pip",
    "datasets>=3.6.0",
    "jupyter>=1.1.1",
    "levenshtein>=0.27.1",
    "lm-eval@git+https://github.com/r-three/lm-evaluation-harness@toksuite",
    "notebook>=7.3.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.6.1",
    "torch>=2.5.0",
    "transformers>=4.53.0",
    "wandb>=0.19.8",
    "seaborn>=0.13.2",
    "rich>=14.0.0",
    "openpyxl>=3.1.5",
    "sentencepiece>=0.2.0",
    "protobuf>=5.29.3",
    "blobfile>=3.0.0",
    "gradio",
    "tokenmonster",
    "spacy",
    "jieba",
    "accelerate",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# avoid conflicts
[tool.setuptools]
packages = ["toksuite"]


[project.optional-dependencies]
build = ["torch", "setuptools", "packaging"]
compile = ["flash-attn"]
dev = [  "ruff", "pytest" ]
eval = [ "lm-eval" ]

[tool.uv]
no-build-isolation-package = ["flash-attn", "xformers"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.4.1"
requires-dist = ["torch", "einops", "setuptools"]

[tool.uv.sources]
lm-eval = { git = "https://github.com/r-three/lm-evaluation-harness", branch = "toksuite" }


[tool.pytest]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = ["Test*"]
python_functions = "test_*"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: tests that require GPU (deselect with '-m \"not gpu\"')",
]

[tool.isort]
profile = "ruff"

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I"]
ignore = []

[tool.ruff.isort]
known-first-party = ["tokenizers"]

[dependency-groups]
dev = [
    "ruff>=0.11.5",
]


[project.scripts]
token-alysis = "toksuite.scripts.compare_tokenizers:main"
